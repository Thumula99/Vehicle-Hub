name: 🚀 Vehicle-Hub CI Pipeline

on:
  push:
    branches: [ "main", "dev", "feature/*" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # ----------------------------------------------------
  # 1. Backend CI (.NET 8 C# Web API)
  # ----------------------------------------------------
  backend-ci:
    name: ⚙️ Backend (.NET 8 C#) Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🔧 Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 📦 Restore NuGet dependencies
        run: dotnet restore VehicleHub.csproj

      - name: 🔨 Build Backend (Release)
        run: dotnet build VehicleHub.csproj --configuration Release --no-restore

  # ----------------------------------------------------
  # 2. Frontend CI (Next.js 14 / React 18)
  # ----------------------------------------------------
  frontend-ci:
    name: 🌐 Frontend (Next.js 14) Build & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Node.js 18 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: client/package.json

      - name: 📦 Install Frontend dependencies
        run: npm install

      - name: 🔨 Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001/api
          NEXT_PUBLIC_SOCKET_URL: http://localhost:5001
